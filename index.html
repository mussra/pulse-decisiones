<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Pulse · Decisiones</title>
<style>
:root{--bg:#0f1b2d;--card:#182a44;--tx:#eaf1fb;--mut:#8fa5c4;--ok:#3ecf8e;--no:#ef6b6b;--mid:#f0b94d;--ac:#4aa3ff}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#0b1424;position:sticky;top:0}
h1{font-size:18px;margin:0;flex:1}main{max-width:760px;margin:0 auto;padding:12px}
select,input,textarea,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #2c4468;background:#10203a;color:var(--tx)}
button{cursor:pointer}button.p{background:var(--ac);color:#04121f;border:0;font-weight:600}
.card{background:var(--card);border-radius:12px;padding:12px;margin:10px 0}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#24406a}.aceptada{background:#1f6b4a}.pendiente{background:#7a5a15}.descartada{background:#6b2b2b}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}.mut{color:var(--mut);font-size:14px}
.v{min-width:64px}.v.on.si{background:var(--ok);color:#04121f}.v.on.no{background:var(--no);color:#04121f}.v.on.dudo{background:var(--mid);color:#04121f}
textarea,input[type=text]{width:100%}.a{background:#10203a;border-radius:8px;padding:6px 8px;margin:6px 0}#login{text-align:center;margin-top:60px}
figure{margin:8px 0}figure img{width:100%;border-radius:8px}</style></head><body>
<header><h1>Pulse · Decisiones</h1><span id="mode" class="mut"></span>
<label class="mut">Votando como <select id="who"></select></label>
<select id="filter"><option value="">Todas</option></select><button id="names">Nombres</button><button id="out" hidden>Salir</button></header>
<main><div id="login" hidden><p>Acceso privado de la familia.</p><button class="p" id="in">Entrar con Google</button></div>
<div id="app" hidden><div class="row"><button class="p" id="new">+ Nueva decisión</button></div><div id="list"></div></div></main>
<script type="module" src="app.js"></script></body></html>
